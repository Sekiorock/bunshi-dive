<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぶんしダイブ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D canvas, glass HUD panels pinned top & bottom, gates as full-screen freeze overlays */
:root{
  --ink:#04060a; --ink2:#0b111a; --panel:rgba(8,12,19,.80); --blue:#0072CE; --blue2:#4aa3ff;
  --white:#f4f7fb; --mute:#93a1b4; --line:rgba(244,247,251,.16); --bad:#ff6178;
  --disp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --num:"Chakra Petch","SF Mono",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--white);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;transition:filter .35s}
#gl.frozen{filter:grayscale(1) brightness(.45) blur(1px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}

#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud > *{pointer-events:auto}
.top{display:flex;align-items:center;gap:10px}
.stg{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--blue2)}
.top h1{margin:0;font-family:var(--disp);font-weight:800;font-size:19px;line-height:1.1}
.top .tt{flex:1;min-width:0}
.pips{display:flex;gap:4px;margin-top:5px}
.pips i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--white)} .pips i.now{background:var(--blue2)}
.icon{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.icon svg{width:20px;height:20px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.info.solo{grid-template-columns:1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 11px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:0}
.lab{font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
#missions{list-style:none;margin:5px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.4}
#missions li{display:flex;gap:7px;align-items:flex-start;color:var(--mute)}
#missions li.cur{color:var(--white)}
#missions li.done{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
#missions li b{flex:none;width:15px;height:15px;margin-top:2px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center}
#missions li.cur b{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(74,163,255,.2)}
#missions li.done b{background:var(--blue);border-color:var(--blue)}
#missions li.done b::after{content:"";width:6px;height:3px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
#chartCard canvas{display:block;width:100%;height:112px;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;color:var(--mute);margin-top:3px}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:middle}
.spacer{flex:1;pointer-events:none!important}
#readouts{display:flex;flex-wrap:wrap;gap:6px}
.ro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 10px;min-width:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ro .k{font-size:10px;color:var(--mute);display:block}
.ro .v{font-family:var(--num);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ro .v small{font-size:11px;font-weight:500;color:var(--mute);margin-left:2px}
.ro.hot{border-color:var(--blue2);box-shadow:0 0 18px rgba(74,163,255,.35)}
.ro.state .v{font-family:var(--disp);font-size:16px}
.guide{display:flex;gap:10px;align-items:center}
.gface{flex:none;width:58px;height:58px;filter:drop-shadow(0 4px 10px rgba(0,114,206,.35))}
.gface svg{width:100%;height:100%}
.bubble{flex:1;min-width:0;background:var(--white);color:#0a0d12;border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:13px;line-height:1.5}
.bubble .who{display:block;font-family:var(--disp);font-weight:800;font-size:11px;color:var(--blue)}
.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
#controls{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.btn{flex:1;min-height:54px;border-radius:16px;background:var(--blue);color:#fff;font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.04em;box-shadow:0 6px 0 #003f73,0 10px 24px rgba(0,114,206,.35);transition:transform .08s,box-shadow .08s;touch-action:none}
.btn:active,.btn.held{transform:translateY(4px);box-shadow:0 2px 0 #003f73,0 4px 14px rgba(0,114,206,.35)}
.btn.ghost{background:var(--ink2);box-shadow:0 6px 0 #000,0 0 0 1px var(--line) inset}
.btn.ghost:active,.btn.ghost.held{box-shadow:0 2px 0 #000,0 0 0 1px var(--line) inset}
.btn.white{background:var(--white);color:#04060a;box-shadow:0 6px 0 #8fa3bb}
.btn.held{animation:glow .6s infinite alternate}
@keyframes glow{to{filter:brightness(1.25)}}
.btn small{display:block;font-size:10px;font-weight:500;opacity:.75;letter-spacing:.08em}
.chips{display:flex;gap:6px;width:100%}
.chip{flex:1;min-height:40px;padding:4px 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;line-height:1.25;font-weight:700}
.chip small{display:block;font-family:var(--num);font-weight:500;font-size:10px;color:var(--mute)}
.chip.on{background:var(--white);color:#04060a;border-color:var(--white)}
.chip.on small{color:#3b4757}
.slider{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 12px 10px}
.slider .sl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.slider .sl b{font-family:var(--num);color:var(--white);font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:2px 0 0;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--blue) var(--p,50%),rgba(255,255,255,.16) var(--p,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--blue)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--white);border:4px solid var(--blue);box-shadow:0 3px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--white);border:4px solid var(--blue)}

/* toast */
#toast{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;z-index:5}
#toast .t{display:inline-block;font-family:var(--disp);font-weight:800;font-size:44px;color:#fff;text-shadow:0 0 24px rgba(74,163,255,.9),0 4px 0 var(--blue);letter-spacing:.04em}
#toast .s{display:block;font-size:14px;margin-top:4px;color:var(--white);text-shadow:0 2px 8px #000}
#toast.go{animation:toast 1.5s ease forwards}
@keyframes toast{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow:auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov.dim{background:rgba(2,4,8,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.panel{width:min(520px,100%);background:var(--ink2);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.panel.in{animation:rise .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}}

/* title */
#title{background:radial-gradient(120% 70% at 50% 0%,#0a2a52 0%,var(--ink) 62%)}
.ttl{width:min(520px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.flag{display:flex;width:84px;height:12px;border-radius:3px;overflow:hidden}
.flag i{flex:1}
.ttl .kicker{font-family:var(--num);font-size:11px;letter-spacing:.3em;color:var(--blue2)}
.ttl h2{margin:0;font-family:var(--disp);font-weight:800;font-size:clamp(46px,14vw,74px);line-height:1;letter-spacing:.02em}
.ttl h2 span{color:var(--blue2)}
.ttl p{margin:0;color:var(--mute);font-size:13px;line-height:1.7;max-width:34em}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 6px;width:100%}
.cast figure{margin:0;display:flex;flex-direction:column;align-items:center}
.cast svg{width:68px;height:68px;animation:bob 2.4s ease-in-out infinite}
.cast figure:nth-child(2n) svg{animation-delay:-.8s}.cast figure:nth-child(3n) svg{animation-delay:-1.5s}
@keyframes bob{50%{transform:translateY(-6px)}}
.cast figcaption{font-size:11px;font-weight:700;line-height:1.3}
.cast figcaption small{display:block;font-family:var(--num);color:var(--mute);font-weight:500}
.stsel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.stsel button{min-height:46px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-family:var(--num);font-weight:700;font-size:15px}
.stsel button:disabled{opacity:.3}
.stsel button small{display:block;font-size:9px;font-family:var(--body);color:var(--mute)}
.wide{width:100%}

/* intro */
.intro-head{display:flex;gap:14px;align-items:center}
.intro-head svg{width:84px;height:84px;flex:none}
.bigno{font-family:var(--num);font-weight:700;letter-spacing:.2em;color:var(--blue2);font-size:12px}
.panel h3{margin:2px 0 0;font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.2;text-wrap:balance}
.panel p{margin:0;font-size:14px;line-height:1.75;color:#d9e1eb}
.panel .goal{background:rgba(0,114,206,.16);border:1px solid rgba(74,163,255,.4);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.6}

/* gate */
#gate{z-index:20}
#freeze{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:21}
.fz{width:100%;background:var(--white);color:#04060a;transform:skewY(-6deg);padding:14px 0;overflow:hidden;box-shadow:0 0 0 6px var(--blue)}
.fz div{white-space:nowrap;font-family:var(--num);font-weight:700;font-size:32px;letter-spacing:.2em;animation:mq 1.1s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
#freeze.go .fz{animation:fz .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fz{0%{transform:skewY(-6deg) scaleY(0)}30%{transform:skewY(-6deg) scaleY(1)}80%{opacity:1}100%{opacity:0;transform:skewY(-6deg) scaleY(.2)}}
.ghead{display:flex;align-items:center;gap:10px}
.gtag{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.18em;background:var(--white);color:#04060a;padding:4px 10px;border-radius:999px}
.gprog{margin-left:auto;font-family:var(--num);color:var(--mute);font-size:13px}
.lock{width:18px;height:18px}
.gchart{background:#060a10;border:1px solid var(--line);border-radius:14px;padding:6px;overflow-x:auto}
.gchart svg{display:block;width:100%;height:auto;min-width:280px}
.gq{display:flex;gap:10px;align-items:flex-start}
.gq svg{width:46px;height:46px;flex:none}
.gq p{font-size:15px;line-height:1.7;margin:0;font-weight:700;color:var(--white)}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;gap:10px;text-align:left;min-height:50px;padding:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:14px;line-height:1.45;transition:transform .08s}
.ch:active{transform:scale(.98)}
.ch i{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-family:var(--num);font-weight:700;background:rgba(255,255,255,.1)}
.ch.ok{background:var(--blue);border-color:var(--blue2)} .ch.ok i{background:#fff;color:var(--blue)}
.ch.ng{opacity:.4;border-color:var(--bad);animation:shake .35s}
.ch:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.gex{border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.7}
.gex.hint{background:rgba(255,97,120,.12);border:1px solid rgba(255,97,120,.45)}
.gex.good{background:rgba(0,114,206,.18);border:1px solid rgba(74,163,255,.5)}
.gex b{font-family:var(--disp)}

/* clear */
.clear h3{font-family:var(--num);letter-spacing:.12em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--num);font-size:24px}
.stats span{font-size:11px;color:var(--mute)}
.burst{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
@media (min-width:760px){ .info{grid-template-columns:minmax(0,360px) minmax(0,320px);justify-content:space-between} #controls,.guide{max-width:620px;width:100%;margin:0 auto} }
</style>

<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div class="tt"><div class="stg" id="stgNo">STAGE 1 / 5</div><h1 id="stgTitle">融解と凝固</h1><div class="pips" id="pips"></div></div>
    <button class="icon" id="muteBtn" aria-label="音のオン・オフ"></button>
    <button class="icon" id="homeBtn" aria-label="タイトルへ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
  </div>
  <div class="info" id="info">
    <div class="card"><span class="lab">Mission</span><ul id="missions"></ul></div>
    <div class="card" id="chartCard"><span class="lab" id="chartLab">Graph</span><canvas id="chart"></canvas><div class="legend" id="legend"></div></div>
  </div>
  <div class="spacer"></div>
  <div id="readouts"></div>
  <div class="guide"><div class="gface" id="gface"></div><div class="bubble" id="bubble"><span class="who" id="gname"></span><span id="gtext"></span></div></div>
  <div id="controls"></div>
</div>

<div id="toast"><div class="t" id="toastT"></div><span class="s" id="toastS"></span></div>

<div id="title" class="ov">
  <div class="ttl">
    <div class="flag" aria-hidden="true"><i style="background:#0072CE"></i><i style="background:#000;box-shadow:inset 0 0 0 1px #333"></i><i style="background:#fff"></i></div>
    <div class="kicker">PHASE CHANGE LAB</div>
    <h2>ぶんし<span>ダイブ</span></h2>
    <p>分子のサイズになって、物質の三態の世界へ。加熱曲線、気液平衡、飽和蒸気圧、沸騰、そして状態図。5つのステージとグラフのゲートを突破しよう。</p>
    <div class="cast" id="cast"></div>
    <button class="btn wide" id="startBtn">スタート<small>音が出ます</small></button>
    <div class="stsel" id="stsel"></div>
  </div>
</div>

<div id="intro" class="ov dim" hidden><div class="panel in" id="introPanel"></div></div>

<div id="gate" class="ov dim" hidden>
  <div class="panel in" id="gpanel">
    <div class="ghead"><svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="gtag" id="gtag">GATE</span><span class="gprog" id="gprog"></span></div>
    <div class="gchart" id="gchart"></div>
    <div class="gq"><div id="gqface"></div><p id="gqtext"></p></div>
    <div class="choices" id="gchoices"></div>
    <div class="gex" id="gex" hidden></div>
    <button class="btn" id="gnext" hidden>次へ</button>
  </div>
</div>
<div id="freeze" hidden><div class="fz"><div>STOP ▶ GRAPH CHECK ▶ STOP ▶ GRAPH CHECK ▶ STOP ▶ GRAPH CHECK ▶ STOP ▶ GRAPH CHECK ▶ STOP ▶ GRAPH CHECK ▶ STOP ▶ GRAPH CHECK ▶ </div></div></div>

<div id="clear" class="ov dim" hidden><div class="panel in clear" id="clearPanel"></div></div>
<canvas class="burst" id="burst"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const f2=v=>v.toFixed(2);

/* ================= DATA ================= */
const LIQ={
  w:{name:'水',ch:'mizu',A:8.07131,B:1730.63,C:233.426,col:0x1f7fe0,ears:true,svg:'#4aa3ff'},
  e:{name:'エタノール',ch:'etano',A:8.20417,B:1642.89,C:230.3,col:0xeef3f9,ears:false,svg:'#f4f7fb'},
  d:{name:'ジエチルエーテル',ch:'eteru',A:6.92032,B:1064.07,C:228.8,col:0x9cc0ea,ears:false,svg:'#9cc0ea'}
};
const psat=(k,T)=>Math.pow(10,LIQ[k].A-LIQ[k].B/(LIQ[k].C+T))*1.01325/760;
const bp=(k,P)=>{let lo=-60,hi=160;for(let i=0;i<40;i++){const m=(lo+hi)/2;psat(k,m)<P?lo=m:hi=m}return (lo+hi)/2};

const CH={
  mizu:{name:'しずくまる',f:'H₂O'}, dora:{name:'ドラポン',f:'CO₂'}, etano:{name:'エタのん',f:'C₂H₅OH'},
  eteru:{name:'エテルン',f:'C₂H₅OC₂H₅'}, nitro:{name:'ちっそん',f:'N₂'}, nafu:{name:'ナフくん',f:'C₁₀H₈'}
};
function face(x,y,k=1,eye='#0a0d12',hl='#fff'){
  return `<g transform="translate(${x} ${y}) scale(${k})"><ellipse cx="-11" cy="-2" rx="4.4" ry="5.8" fill="${eye}"/><ellipse cx="11" cy="-2" rx="4.4" ry="5.8" fill="${eye}"/><circle cx="-9.4" cy="-4.2" r="1.6" fill="${hl}"/><circle cx="12.6" cy="-4.2" r="1.6" fill="${hl}"/><path d="M-4.5 6 q2.2 3.2 4.5 0 q2.2 3.2 4.5 0" stroke="${eye}" stroke-width="2.2" fill="none" stroke-linecap="round"/><ellipse cx="-19.5" cy="6" rx="5.5" ry="3.2" fill="#ff9fb8" opacity=".6"/><ellipse cx="19.5" cy="6" rx="5.5" ry="3.2" fill="#ff9fb8" opacity=".6"/></g>`;
}
const shine=(x,y,r)=>`<ellipse cx="${x-r*.38}" cy="${y-r*.42}" rx="${r*.32}" ry="${r*.2}" transform="rotate(-30 ${x-r*.38} ${y-r*.42})" fill="#fff" opacity=".45"/>`;
function hexPath(cx,cy,r){let d='';for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)}return d+'Z'}
function charSVG(id){

/* ================= FLOW ================= */
function clearStage(){scene.remove(G);G.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(m=>{if(m.map&&m.map!==FACE&&m.map!==FACE_DARK)m.map.dispose();m.dispose()})}});G=new THREE.Group();scene.add(G);ST.fill(0);$('#controls').innerHTML='';$('#readouts').innerHTML=''}
function loadStage(n){clearStage();S.stage=n;const d=STAGES[n-1];S.cur=d;d.st={};cam.th=.5;cam.ph=1.12;
  $('#stgNo').textContent=`STAGE ${n} / ${STAGES.length}`;$('#stgTitle').textContent=d.title;$('#pips').innerHTML=STAGES.map((s,i)=>`<i class="${i+1<n?'on':i+1===n?'now':''}"></i>`).join('');
  d.setup();renderMissions();say(d.ch,d.intro.split('。')[0]+'。');$('#hud').hidden=false;
  const p=$('#introPanel');p.innerHTML=`<div class="intro-head">${charSVG(d.ch)}<div><div class="bigno">STAGE ${n}</div><h3>${d.title}</h3></div></div><p>${d.intro}</p><div class="goal"><b>GOAL</b>　${d.goal}</div><button class="btn" id="goBtn">START</button>`;
  $('#intro').hidden=false;S.paused=true;$('#goBtn').onclick=()=>{Snd.init();Snd.whoosh();$('#intro').hidden=true;S.paused=false;say(d.ch,d.intro)};$('#goBtn').focus()}
function toTitle(){S.paused=true;$('#hud').hidden=true;$('#intro').hidden=true;$('#gate').hidden=true;cv.classList.remove('frozen');buildTitle();$('#title').hidden=false;clearStage();S.cur=null;titleScene()}
function buildTitle(){$('#cast').innerHTML=Object.keys(CH).map(k=>`<figure>${charSVG(k)}<figcaption>${CH[k].name}<small>${CH[k].f}</small></figcaption></figure>`).join('');
  $('#stsel').innerHTML=STAGES.map((s,i)=>`<button data-n="${i+1}" ${i+1>S.unlocked?'disabled':''}>${i+1}<small>${s.title.slice(0,4)}</small></button>`).join('');
  $('#stsel').querySelectorAll('button').forEach(b=>b.onclick=()=>{Snd.init();Snd.tap();go(+b.dataset.n)})}
function go(n){$('#title').hidden=true;if(!S.start)S.start=performance.now();loadStage(n)}
let titleMols=null;
function titleScene(){titleMols=new Mols(120);for(let i=0;i<120;i++){X[i]=rnd(-9,9);Y[i]=rnd(0,9);Z[i]=rnd(-9,4);const d=randDir(.6);VX[i]=d[0];VY[i]=d[1];VZ[i]=d[2]}cam.rT=14;cam.yT=4}
$('#startBtn').onclick=()=>{Snd.init();Snd.fanfare();go(1)};
$('#muteBtn').onclick=()=>{Snd.init();Snd.on=!Snd.on;setMuteIcon()};
$('#homeBtn').onclick=()=>{Snd.tap();toTitle()};
setMuteIcon();buildTitle();titleScene();

let last=performance.now(),cht=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;S.t+=dt;
  if(S.cur){if(!S.paused)S.cur.tick(dt);S.cur.draw();cht+=dt;if(cht>.1&&!$('#chartCard').hidden){cht=0;S.cur.chart()}}
  else if(titleMols){for(let i=0;i<120;i++){X[i]+=VX[i]*dt;Y[i]+=VY[i]*dt;Z[i]+=VZ[i]*dt;if(Math.abs(X[i])>9)VX[i]*=-1;if(Y[i]<0||Y[i]>9)VY[i]*=-1;if(Z[i]<-9||Z[i]>4)VZ[i]*=-1}titleMols.draw(120,X,Y,Z,null);cam.th+=dt*.05}
  updateCamera(dt);R.render(scene,camera)}
requestAnimationFrame(loop);
</script>
