<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ぶんしダイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D scene you touch directly; one big white "next action" banner on top; readouts + guide at the bottom; gates are full-screen sheets with the graph pinned on top */
:root{
  --ink:#04060a; --ink2:#0b111a; --panel:rgba(8,12,19,.82); --blue:#0072CE; --blue2:#4aa3ff;
  --white:#f4f7fb; --mute:#93a1b4; --line:rgba(244,247,251,.16); --bad:#ff6178;
  --disp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --num:"Chakra Petch","SF Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--white);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;transition:filter .35s}
#gl.frozen{filter:grayscale(1) brightness(.4) blur(2px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#hud .pe{pointer-events:auto}
.top{display:flex;align-items:center;gap:8px}
.top .tt{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.stg{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--blue2);white-space:nowrap}
.top h1{margin:0;font-family:var(--disp);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;margin-left:auto}
.pips i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--white)}.pips i.now{background:var(--blue2)}
.icon{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px}

/* the big next-action banner */
#coach{background:var(--white);color:#04060a;border-radius:18px;padding:10px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 3px rgba(0,114,206,.0);transition:box-shadow .3s,background .3s}
#coach.flash{background:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue2),0 0 40px rgba(74,163,255,.7)}
#coach .crow{display:flex;align-items:center;gap:8px;margin-bottom:3px}
#coach .cstep{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--blue)}
#coach.flash .cstep{color:#fff}
#coach .cdots{display:flex;gap:4px;margin-left:auto}
#coach .cdots i{width:9px;height:9px;border-radius:50%;background:#cfd8e3}
#coach .cdots i.on{background:var(--blue)}#coach .cdots i.now{background:#04060a;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
#coach .ctext{font-family:var(--disp);font-weight:800;font-size:clamp(17px,4.8vw,21px);line-height:1.4;text-wrap:balance}
#coach .ctext b{color:var(--blue)}
#coach.flash .ctext b{color:#fff}
#coach .ctext.in{animation:cin .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes cin{from{transform:translateX(24px);opacity:0}}

.mid{display:flex;justify-content:flex-end;gap:8px;align-items:flex-start}
#chartCard{width:min(44%,240px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px 9px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:width .3s}
#chartCard.big{width:100%}
#chartCard .lab{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden;font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mute)}
#chartCard canvas{display:block;width:100%;height:90px;margin-top:3px;transition:height .3s}
#chartCard.big canvas{height:200px}
.legend{display:flex;flex-wrap:wrap;gap:2px 9px;font-size:10px;color:var(--mute);margin-top:2px}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:middle}
.spacer{flex:1}
#extra{display:flex;justify-content:center;align-items:flex-end;gap:10px}
#readouts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ro{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 11px 6px;min-width:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .2s,box-shadow .2s}
.ro .k{font-size:11px;color:var(--mute);display:block;font-weight:700}
.ro .v{font-family:var(--num);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.ro .v small{font-size:11px;font-weight:500;color:var(--mute);margin-left:2px}
.ro.hot{border-color:var(--blue2);box-shadow:0 0 18px rgba(74,163,255,.45)}
.ro.state .v{font-family:var(--disp);font-size:18px}
#talk{display:flex;gap:8px;align-items:flex-end;min-height:62px;transition:opacity .4s,transform .4s}
#talk.off{opacity:0;transform:translateY(10px);pointer-events:none!important}
#talk .gface{flex:none;width:54px;height:54px;filter:drop-shadow(0 4px 10px rgba(0,114,206,.35))}
#talk .gface svg{width:100%;height:100%}
.bubble{flex:1;min-width:0;background:rgba(244,247,251,.94);color:#0a0d12;border-radius:16px 16px 16px 4px;padding:7px 11px;font-size:13.5px;line-height:1.5}
.bubble .who{display:block;font-family:var(--disp);font-weight:800;font-size:11px;color:var(--blue)}
#talk.pop .bubble{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.9);opacity:.3}}

/* in-HUD instruments */
.bal{width:min(210px,58vw);background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:4px 6px 2px;transition:border-color .2s,box-shadow .2s,transform .1s}
.bal:active{transform:scale(.97)}
.bal.near{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(74,163,255,.25),0 0 30px rgba(74,163,255,.5);animation:breath 1s ease-in-out infinite alternate}
@keyframes breath{to{box-shadow:0 0 0 7px rgba(74,163,255,.15),0 0 40px rgba(74,163,255,.7)}}
.bal svg{display:block;width:100%;height:auto}
.bal .cap{display:block;font-family:var(--disp);font-weight:800;font-size:13px;color:var(--white);padding-bottom:4px}
.gauge{width:min(170px,44vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px}
.gauge svg{display:block;width:100%;height:auto}

/* gesture hint */
#hand{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:8;transition:opacity .3s}
#hand.off{opacity:0}
#hand .ring{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:3px solid var(--white);box-shadow:0 0 18px var(--blue2);animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
#hand .fg{position:absolute;left:-14px;top:-6px;width:58px;height:58px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#hand .tip{position:absolute;left:30px;top:-46px;white-space:nowrap;background:var(--blue);color:#fff;font-family:var(--disp);font-weight:800;font-size:15px;padding:5px 11px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#hand.g-up .fg{animation:gup 1.5s cubic-bezier(.5,0,.3,1) infinite}
#hand.g-down .fg{animation:gdown 1.5s cubic-bezier(.5,0,.3,1) infinite}
#hand.g-h .fg{animation:gh 1.8s ease-in-out infinite}
#hand.g-v .fg{animation:gv 1.8s ease-in-out infinite}
#hand.g-tap .fg{animation:gtap 1s ease-in-out infinite}
@keyframes gup{0%{transform:translateY(30px);opacity:0}15%{opacity:1}70%{transform:translateY(-70px);opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes gdown{0%{transform:translateY(-60px);opacity:0}15%{opacity:1}70%{transform:translateY(40px);opacity:1}100%{transform:translateY(40px);opacity:0}}
@keyframes gh{0%,100%{transform:translateX(-50px)}50%{transform:translateX(50px)}}
@keyframes gv{0%,100%{transform:translateY(30px)}50%{transform:translateY(-60px)}}
@keyframes gtap{0%,100%{transform:scale(1)}50%{transform:scale(.82) translateY(6px)}}

/* toast */
#toast{position:fixed;left:0;right:0;top:44%;text-align:center;pointer-events:none;z-index:6;padding:0 16px}
#toast .t{display:inline-block;font-family:var(--disp);font-weight:800;font-size:clamp(34px,11vw,52px);color:#fff;text-shadow:0 0 24px rgba(74,163,255,.9),0 4px 0 var(--blue);letter-spacing:.04em}
#toast .s{display:block;font-family:var(--disp);font-weight:800;font-size:16px;margin-top:4px;color:var(--white);text-shadow:0 2px 8px #000}
#toast{opacity:0}
#toast.go{animation:toast 1.7s ease forwards}
@keyframes toast{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow:auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov.dim{background:rgba(2,4,8,.74);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.panel{width:min(520px,100%);background:var(--ink2);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.panel.in{animation:rise .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.btn{min-height:58px;border-radius:18px;background:var(--blue);color:#fff;font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:.04em;box-shadow:0 6px 0 #003f73,0 10px 24px rgba(0,114,206,.35);transition:transform .08s,box-shadow .08s,opacity .2s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #003f73}
.btn:disabled{background:#1a2431;color:var(--mute);box-shadow:0 6px 0 #000;cursor:default}
.btn small{display:block;font-size:11px;font-weight:500;opacity:.8;letter-spacing:.06em}
.wide{width:100%}

#title{background:radial-gradient(120% 70% at 50% 0%,#0a2a52 0%,var(--ink) 62%)}
.ttl{width:min(520px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.flag{display:flex;width:84px;height:12px;border-radius:3px;overflow:hidden}
.flag i{flex:1}
.ttl .kicker{font-family:var(--num);font-size:11px;letter-spacing:.3em;color:var(--blue2)}
.ttl h2{margin:0;font-family:var(--disp);font-weight:800;font-size:clamp(46px,14vw,74px);line-height:1;letter-spacing:.02em}
.ttl h2 span{color:var(--blue2)}
.ttl p{margin:0;color:#c9d4e2;font-size:14px;line-height:1.7;max-width:34em}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 6px;width:100%}
.cast figure{margin:0;display:flex;flex-direction:column;align-items:center}
.cast svg{width:66px;height:66px;animation:bob 2.4s ease-in-out infinite}
.cast figure:nth-child(2n) svg{animation-delay:-.8s}.cast figure:nth-child(3n) svg{animation-delay:-1.5s}
@keyframes bob{50%{transform:translateY(-6px)}}
.cast figcaption{font-size:11px;font-weight:700;line-height:1.3}
.cast figcaption small{display:block;font-family:var(--num);color:var(--mute);font-weight:500}
.stsel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.stsel button{min-height:48px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-family:var(--num);font-weight:700;font-size:16px}
.stsel button:disabled{opacity:.3}
.stsel button small{display:block;font-size:9px;font-family:var(--body);color:var(--mute)}

.intro-head{display:flex;gap:14px;align-items:center}
.intro-head svg{width:84px;height:84px;flex:none}
.bigno{font-family:var(--num);font-weight:700;letter-spacing:.2em;color:var(--blue2);font-size:12px}
.panel h3{margin:2px 0 0;font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.2;text-wrap:balance}
.panel p{margin:0;font-size:15px;line-height:1.75;color:#d9e1eb}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:t}
.todo li{counter-increment:t;display:flex;gap:10px;align-items:flex-start;background:rgba(0,114,206,.14);border:1px solid rgba(74,163,255,.35);border-radius:14px;padding:9px 12px;font-family:var(--disp);font-weight:800;font-size:15px;line-height:1.45}
.todo li::before{content:counter(t);flex:none;width:24px;height:24px;border-radius:50%;background:var(--white);color:#04060a;display:grid;place-items:center;font-family:var(--num);font-size:13px;margin-top:1px}
.howto{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
.howto svg{width:34px;height:34px;flex:none}

/* ---------- gate sheet ---------- */
#gate{position:fixed;inset:0;z-index:20;background:var(--ink2);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:sheet .45s cubic-bezier(.2,1.1,.3,1)}
@keyframes sheet{from{transform:translateY(100%)}}
.ghead{flex:none;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.gtag{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.18em;background:var(--white);color:#04060a;padding:4px 10px;border-radius:999px}
.gprog{margin-left:auto;display:flex;gap:4px}
.gprog i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.gprog i.on{background:var(--blue2)}.gprog i.now{background:var(--white)}
.gmain{flex:1;min-height:0;display:flex;flex-direction:column}
.gfig{flex:none;padding:0 max(10px,env(safe-area-inset-right,0px)) 4px max(10px,env(safe-area-inset-left,0px))}
.gchart{position:relative;height:min(44vh,calc(100vw * .74));max-height:440px;background:#060a10;border:1px solid var(--line);border-radius:16px;touch-action:none;overflow:hidden}
.gchart > svg{position:absolute;inset:0;width:100%;height:100%}
.gchart .cur{pointer-events:none}
.gnote{font-size:12px;color:var(--mute);text-align:center;margin-top:4px;display:flex;justify-content:center;gap:6px;align-items:center}
.gnote b{color:var(--white);font-family:var(--num)}
.gbody{flex:1;min-height:0;overflow:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.gq{display:flex;gap:10px;align-items:flex-start}
.gq .f{width:46px;height:46px;flex:none}
.gq .f svg{width:100%;height:100%}
.gq p{font-size:16px;line-height:1.65;margin:0;font-weight:700;color:var(--white)}
.choices{display:grid;grid-template-columns:1fr;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.ch{display:flex;align-items:center;gap:10px;text-align:left;min-height:54px;padding:8px 12px;border-radius:16px;background:#121a25;border:1.5px solid var(--line);font-size:15px;font-weight:700;line-height:1.4;transition:transform .08s,background .2s}
.ch:active{transform:scale(.97)}
.ch i{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-family:var(--num);font-weight:700;background:rgba(255,255,255,.1)}
.ch.ok{background:var(--blue);border-color:var(--blue2);box-shadow:0 0 24px rgba(74,163,255,.5)}.ch.ok i{background:#fff;color:var(--blue)}
.ch.ng{opacity:.35;border-color:var(--bad);animation:shake .35s}
.ch:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.gex{border-radius:16px;padding:11px 13px;font-size:14px;line-height:1.75;animation:rise .35s ease}
.gex.hint{background:rgba(255,97,120,.12);border:1px solid rgba(255,97,120,.45)}
.gex.good{background:rgba(0,114,206,.2);border:1px solid rgba(74,163,255,.55)}
.gex b{font-family:var(--disp)}
.gfoot{flex:none;padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.gfoot .btn{width:100%}
@media (min-width:820px) and (min-aspect-ratio:1/1){
  .gmain{flex-direction:row}
  .gfig{flex:1.15;padding:0 8px 12px 16px;display:flex;flex-direction:column}
  .gchart{height:auto;flex:1;max-height:none}
  .gbody{flex:1}
}
#freeze{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:21}
.fz{width:100%;background:var(--white);color:#04060a;transform:skewY(-6deg);padding:14px 0;overflow:hidden;box-shadow:0 0 0 6px var(--blue)}
.fz div{white-space:nowrap;font-family:var(--num);font-weight:700;font-size:30px;letter-spacing:.2em;animation:mq 1.1s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
#freeze.go .fz{animation:fz .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fz{0%{transform:skewY(-6deg) scaleY(0)}30%{transform:skewY(-6deg) scaleY(1)}80%{opacity:1}100%{opacity:0;transform:skewY(-6deg) scaleY(.2)}}

.clear h3{font-family:var(--num);letter-spacing:.12em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--num);font-size:24px}
.stats span{font-size:11px;color:var(--mute)}
.burst{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ===== Estonian white-forward theme ===== */
:root{--paper:#ffffff;--ink-t:#04060a;--mute2:#5b6878;--line2:rgba(4,6,10,.13)}
.top{background:var(--paper);color:var(--ink-t);border-radius:16px;padding:5px 5px 5px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.top h1{color:var(--ink-t)}.stg{color:var(--blue)}
.pips i{background:#d5dde7}.pips i.on{background:var(--ink-t)}.pips i.now{background:var(--blue)}
.icon{background:var(--paper);border:1.5px solid var(--line2);color:var(--ink-t)}
.top .icon{width:38px;height:38px}
#coach{box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 2px #04060a}
#chartCard{background:var(--paper);border:0;box-shadow:0 8px 24px rgba(0,0,0,.35);color:var(--ink-t);backdrop-filter:none;-webkit-backdrop-filter:none}
#chartCard .lab,.legend{color:var(--mute2)}
.ro{background:var(--paper);border:0;box-shadow:0 6px 18px rgba(0,0,0,.4);backdrop-filter:none;-webkit-backdrop-filter:none}
.ro .k{color:var(--mute2)}.ro .v{color:var(--ink-t)}.ro .v small{color:var(--mute2)}
.ro.hot{background:var(--blue);box-shadow:0 0 0 3px #fff,0 0 24px rgba(74,163,255,.7)}.ro.hot .k,.ro.hot .v,.ro.hot .v small{color:#fff}
.bal,.gauge{background:var(--paper);border:0;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.bal .cap{color:var(--ink-t)}
.bal.near{box-shadow:0 0 0 4px var(--blue2),0 0 30px rgba(74,163,255,.7)}
.bubble{background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.panel{background:var(--paper);color:var(--ink-t);border:0;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 6px 0 var(--blue)}
.panel h3{color:var(--ink-t)}.panel p{color:#2a3442}.bigno{color:var(--blue)}

.ttl h2{color:var(--ink-t)}.ttl p{color:#2a3442}.ttl .kicker{color:var(--blue)}

.gnote{color:var(--mute2)}.gnote b{color:var(--ink-t)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const f2=v=>v.toFixed(2);
const now=()=>performance.now();

/* ================= DATA ================= */
const LIQ={
  w:{name:'水',ch:'mizu',A:8.07131,B:1730.63,C:233.426,col:0x1f7fe0,ears:true,svg:'#4aa3ff'},
  e:{name:'エタノール',ch:'etano',A:8.20417,B:1642.89,C:230.3,col:0xeef3f9,ears:false,svg:'#f4f7fb'},
  d:{name:'ジエチルエーテル',ch:'eteru',A:6.92032,B:1064.07,C:228.8,col:0x9cc0ea,ears:false,svg:'#9cc0ea'}
};
const psat=(k,T)=>Math.pow(10,LIQ[k].A-LIQ[k].B/(LIQ[k].C+T))*1.01325/760;
const bp=(k,P)=>{let lo=-60,hi=160;for(let i=0;i<40;i++){const m=(lo+hi)/2;psat(k,m)<P?lo=m:hi=m}return (lo+hi)/2};
const CH={
  mizu:{name:'しずくまる',f:'H₂O'}, dora:{name:'ドラポン',f:'CO₂'}, etano:{name:'エタのん',f:'C₂H₅OH'},
  eteru:{name:'エテルン',f:'C₂H₅OC₂H₅'}, nitro:{name:'ちっそん',f:'N₂'}, nafu:{name:'ナフくん',f:'C₁₀H₈'}
};
const INK='#04060a',OL=`stroke="${INK}" stroke-width="3" stroke-linejoin="round"`;
function eye(x,y,s,tilt,ink,lid=0){return `<g transform="translate(${x} ${y}) rotate(${tilt}) scale(${s})"><path d="M-9 ${lid} A9 ${7.5-lid*.6} 0 0 0 9 ${lid}Z" fill="#fff" stroke="${INK}" stroke-width="2.2"/><circle cx="1.8" cy="${3+lid*.6}" r="3.1" fill="${INK}"/><path d="M-11.5 ${lid-.5} H11.5" stroke="${ink}" stroke-width="3.6" stroke-linecap="round"/><path d="M-6 10.5 q6 3 12 0" stroke="${ink}" stroke-opacity=".5" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M-5 13.5 q5 2 10 0" stroke="${ink}" stroke-opacity=".3" stroke-width="1.3" fill="none" stroke-linecap="round"/></g>`}
const MOUTH={
  tooth:i=>`<path d="M-10 0 q5 -4 10 -1 q5 3 9 -2" stroke="${i}" stroke-width="2.8" fill="none" stroke-linecap="round"/><rect x="-3.5" y="-1.6" width="6" height="6" rx="1.2" fill="#fff" stroke="${INK}" stroke-width="1.7"/>`,
  lips:i=>`<path d="M-11 0 q11 -7 22 0 q-11 8 -22 0Z" fill="#f4f7fb" stroke="${INK}" stroke-width="2.2"/><path d="M-10 0 H10" stroke="${INK}" stroke-width="1.5"/>`,
  drool:i=>`<path d="M-8 -2 q8 10 16 0 q-8 2 -16 0Z" fill="${INK}" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 3.5 q2.6 6 0 9.5 q-2.6 -3.5 0 -9.5Z" fill="#9cc8ff" stroke="${INK}" stroke-width="1.3"/>`,
  tongue:i=>`<path d="M-9 0 q9 3 18 0" stroke="${i}" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M-1 1.5 v5 a3.6 3.6 0 0 0 7.2 0 v-5" fill="#9cc8ff" stroke="${INK}" stroke-width="1.7"/>`,
  stache:i=>`<path d="M-13 -1 q6.5 6 13 0 q6.5 6 13 0" stroke="${i}" stroke-width="3.8" fill="none" stroke-linecap="round"/><path d="M-3 7 q3 -1.5 6 0" stroke="${i}" stroke-width="2" fill="none" stroke-linecap="round"/>`,
  flat:i=>`<path d="M-10 0 H5 l4 -2.5" stroke="${i}" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M-6 3 v2" stroke="${i}" stroke-width="1.6" stroke-linecap="round"/>`};
function face(x,y,k,m,ink=INK,lid=0){return `<g transform="translate(${x} ${y}) scale(${k})">${eye(-12,-2,1,-7,ink,lid)}${eye(12.5,-3.5,1.2,9,ink,lid)}<g transform="translate(0 14)">${MOUTH[m](ink)}</g></g>`}
const sweat=(x,y)=>`<path d="M${x} ${y} q4.5 6.5 0 10 q-4.5 -3.5 0 -10Z" fill="#9cc8ff" stroke="${INK}" stroke-width="1.6"/>`;
const shine=(x,y,r)=>`<ellipse cx="${x-r*.42}" cy="${y-r*.46}" rx="${r*.22}" ry="${r*.12}" transform="rotate(-30 ${x-r*.42} ${y-r*.46})" fill="#fff" opacity=".55"/>`;
function hexPath(cx,cy,r){let d='';for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)}return d+'Z'}
function charSVG(id){
  let b='';
  if(id==='mizu') b=`<circle cx="-28" cy="-27" r="13" fill="#f4f7fb" ${OL}/><circle cx="29" cy="-30" r="11" fill="#f4f7fb" ${OL}/><path d="M-38 10 C-40 -22 -18 -34 2 -32 C26 -31 41 -14 39 10 C37 34 20 45 0 44 C-22 44 -37 33 -38 10Z" fill="#0072CE" ${OL}/><path d="M-2 -32 q-3 -10 5 -12 q4 4 -2 6" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>${shine(0,6,38)}${face(0,8,1,'tooth')}${sweat(31,-12)}`;
  if(id==='dora') b=`<circle cx="-35" cy="8" r="22" fill="#f4f7fb" ${OL}/><circle cx="36" cy="5" r="20" fill="#f4f7fb" ${OL}/><path d="M-30 8 C-31 -16 -14 -26 2 -25 C20 -24 32 -12 31 8 C30 28 16 38 0 37 C-17 37 -30 27 -30 8Z" fill="#1a2028" ${OL}/>${shine(0,6,31)}${face(0,6,.85,'lips','#f4f7fb')}<g fill="#f4f7fb" opacity=".7"><circle cx="-10" cy="30" r="1.1"/><circle cx="-5" cy="32" r="1.1"/><circle cx="6" cy="32" r="1.1"/><circle cx="11" cy="30" r="1.1"/></g>`;
  if(id==='etano') b=`<circle cx="-31" cy="16" r="15" fill="#dfe8f3" ${OL}/><path d="M24 -16 L33 -24" stroke="${INK}" stroke-width="3"/><circle cx="36" cy="-26" r="12" fill="#0072CE" ${OL}/><circle cx="47" cy="-38" r="6.5" fill="#f4f7fb" ${OL}/><path d="M-33 8 C-34 -18 -16 -27 1 -26 C20 -25 35 -12 33 9 C31 31 16 42 -1 41 C-19 41 -32 30 -33 8Z" fill="#f4f7fb" ${OL}/>${shine(0,8,34)}${face(0,10,.92,'drool')}`;
  if(id==='eteru') b=`<path d="M-44 44 q6 -6 12 0 t12 0" stroke="#4aa3ff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M18 47 q6 -6 12 0 t12 0" stroke="#4aa3ff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="2" cy="-31" r="11" fill="#0072CE" ${OL}/><path d="M-48 6 C-48 -18 -24 -27 2 -27 C28 -27 48 -16 47 6 C46 28 26 37 0 37 C-27 37 -48 28 -48 6Z" fill="#b9d4f1" ${OL}/>${shine(0,4,36)}${face(0,4,.95,'tongue',INK,2.6)}`;
  if(id==='nitro') b=`<circle cx="-17" cy="6" r="31" fill="#dce8f6" ${OL}/><circle cx="18" cy="2" r="30" fill="#dce8f6" ${OL}/><circle cx="-17" cy="6" r="29.5" fill="#dce8f6"/><circle cx="18" cy="2" r="28.5" fill="#dce8f6"/>${shine(-8,4,40)}<path d="M-46 -30 l6 6 m0 -6 l-6 6 M42 -34 l5 5 m0 -5 l-5 5 M50 26 l4 4 m0 -4 l-4 4" stroke="#4aa3ff" stroke-width="2.4" stroke-linecap="round"/>${face(0,6,1,'stache')}`;
  if(id==='nafu') b=`<path d="${hexPath(-22,6,28)}" fill="#f4f7fb" stroke="#0072CE" stroke-width="4" stroke-linejoin="round"/><path d="${hexPath(22,6,28)}" fill="#f4f7fb" stroke="#0072CE" stroke-width="4" stroke-linejoin="round"/><path d="M-26 -10 q14 -7 28 0 q12 -6 22 -1" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round"/>${face(0,8,.9,'flat')}${sweat(-38,-14)}`;
  return `<svg viewBox="-60 -60 120 120" width="240" height="240" xmlns="http://www.w3.org/2000/svg" aria-label="${CH[id].name}">${b}</svg>`;
}

/* ================= SOUND ================= */
const Snd={ctx:null,on:true,m:null,lastPop:0,noise:null,lp:null,
  init(){if(this.ctx){if(this.ctx.state!=='running'&&this.ctx.resume)this.ctx.resume();return}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.m=this.ctx.createGain();this.m.gain.value=.55;
    const comp=this.ctx.createDynamicsCompressor();this.m.connect(comp);comp.connect(this.ctx.destination);
    const len=this.ctx.sampleRate*2,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noise=buf;},
  tone(f,at,dur,type='sine',vol=.2,f2){const c=this.ctx;if(!c||!this.on)return;const t=c.currentTime+at;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.m);o.start(t);o.stop(t+dur+.03)},
  hiss(at,dur,vol=.1,hp=3000){const c=this.ctx;if(!c||!this.on)return;const t=c.currentTime+at;const s=c.createBufferSource();s.buffer=this.noise;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(this.m);s.start(t);s.stop(t+dur)},
  flame(level){const c=this.ctx;if(!c)return;if(!this.lp){const s=c.createBufferSource();s.buffer=this.noise;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=.8;f.frequency.value=500;const g=c.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(this.m);s.start();this.lp={g,f}}
    const v=this.on?Math.min(.22,Math.abs(level)*.2):0;this.lp.g.gain.setTargetAtTime(v,c.currentTime,.08);this.lp.f.frequency.setTargetAtTime(level<0?2600:300+700*level,c.currentTime,.1)},
  tap(){this.tone(1568,0,.05,'square',.05);this.tone(2349,.03,.06,'sine',.06)},
  grab(){this.tone(880,0,.06,'triangle',.08,1320)},
  tick(){this.tone(2637,0,.025,'square',.025)},
  tempTick(T){this.tone(clamp(420+T*7,200,1600),0,.04,'square',.03)},
  pop(v=.07){const n=now();if(n-this.lastPop<60)return;this.lastPop=n;this.tone(600+Math.random()*700,0,.08,'sine',v,240)},
  drip(){const n=now();if(n-this.lastPop<80)return;this.lastPop=n;this.tone(1900+Math.random()*500,0,.05,'triangle',.035,1200)},
  clack(){this.tone(180,0,.12,'square',.12,90);this.hiss(0,.12,.12,900);this.tone(1760,.04,.15,'triangle',.07)},
  good(){[0,4,7,12,16].forEach((s,i)=>this.tone(1046.5*2**(s/12),i*.055,.18,'triangle',.15));this.tone(4186,.28,.25,'sine',.05);this.hiss(.28,.2,.04,7000)},
  mission(){[0,7,12].forEach((s,i)=>this.tone(1318.5*2**(s/12),i*.07,.22,'square',.06));this.tone(2637,.21,.3,'sine',.08)},
  bad(){this.tone(233,0,.12,'square',.07,196);this.tone(174,.12,.2,'square',.07,147)},
  lock(){this.tone(1400,0,.45,'sawtooth',.08,90);this.hiss(0,.35,.12,800);this.tone(98,.42,.25,'square',.12,60)},
  unlock(){this.tone(220,0,.35,'sawtooth',.06,1760);[0,4,7,11,14].forEach((s,i)=>this.tone(880*2**(s/12),.3+i*.05,.2,'triangle',.12))},
  fanfare(){const n=[0,4,7,12,7,12,16,19];n.forEach((s,i)=>this.tone(523.25*2**(s/12),i*.09,.25,'square',.07));[0,4,7,12].forEach(s=>this.tone(523.25*2**((s+12)/12),.8,.9,'triangle',.08));this.hiss(.8,.5,.05,6000)},
  whoosh(){this.hiss(0,.3,.08,1500);this.tone(300,0,.3,'sine',.05,900)},
  boing(){this.tone(300,0,.18,'sine',.12,900);this.tone(900,.12,.12,'triangle',.06,1400)}
};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function setMuteIcon(){$('#muteBtn').innerHTML=Snd.on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'}

/* ================= THREE ================= */
const cv=$('#gl');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(2,window.devicePixelRatio||1));R.setClearColor(0x04060a,1);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x04060a,24,64);
const camera=new THREE.PerspectiveCamera(45,1,.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x0a2a55,.9));
const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(4,10,6);scene.add(dl);
const grid=new THREE.GridHelper(90,90,0x0b4f99,0x0c1d33);scene.add(grid);
let G=new THREE.Group();scene.add(G);
function makeFaceTex(bg,eye){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,256,128);x.fillStyle=eye;x.strokeStyle=eye;x.lineCap='round';
  [[52,56,5.2,-.12],[76,55,6.4,.16]].forEach(([cx,cy,r,t])=>{x.save();x.translate(cx,cy);x.rotate(t);x.beginPath();x.ellipse(1,0,r,r*.8,0,0,Math.PI);x.fill();x.lineWidth=3.2;x.beginPath();x.moveTo(-r-2.5,-.5);x.lineTo(r+2.5,-.5);x.stroke();x.globalAlpha=.4;x.lineWidth=1.4;x.beginPath();x.moveTo(-r*.7,r+3);x.quadraticCurveTo(0,r+5,r*.7,r+3);x.stroke();x.restore()});
  x.lineWidth=2.6;x.beginPath();x.moveTo(57,72);x.quadraticCurveTo(61,68.5,64,71);x.quadraticCurveTo(67,73.5,71,70);x.stroke();x.fillStyle=bg;x.fillRect(61.5,70.5,3.5,3.5);x.strokeStyle=eye;x.lineWidth=1.2;x.strokeRect(61.5,70.5,3.5,3.5);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
const FACE=makeFaceTex('#ffffff','#0a0d12'),FACE_DARK=makeFaceTex('#252d39','#f4f7fb');
const M4=new THREE.Matrix4(),V1=new THREE.Vector3(),V2=new THREE.Vector3(),ONE=new THREE.Vector3(1,1,1),EL=new THREE.Vector3(),ER=new THREE.Vector3(),QI=new THREE.Quaternion();
class Mols{
  constructor(max,r=.17,parent=G){this.max=max;this.r=r;
    this.mat=new THREE.MeshPhongMaterial({color:0x1f7fe0,map:FACE,shininess:70,specular:0x2a4a6a});

/* ================= FLOW ================= */
function clearStage(){scene.remove(G);G.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(m=>{if(m.map&&m.map!==FACE&&m.map!==FACE_DARK&&!Object.values(CTEX).includes(m.map))m.map.dispose();m.dispose()})}});
  G=new THREE.Group();scene.add(G);ST.fill(0);grabs.length=0;active=null;$('#readouts').innerHTML='';$('#extra').innerHTML='';Snd.flame(0);S.hint=null;EQ.onEv=EQ.onCo=null;scene.fog.near=24;scene.fog.far=64;grid.position.y=-.3}
function loadStage(n){clearStage();S.stage=n;const d=STAGES[n-1];S.cur=d;d.st={};d.thR=null;cam.th=0;cam.ph=1.15;S.si=0;
  $('#stgNo').textContent=`STAGE ${n}`;$('#stgTitle').textContent=d.title;$('#pips').innerHTML=STAGES.map((s,i)=>`<i class="${i+1<n?'on':i+1===n?'now':''}"></i>`).join('');
  d.setup();$('#hud').hidden=false;renderCoach();$('#talk').classList.add('off');
  const p=$('#introPanel');p.innerHTML=`<div class="intro-head">${charSVG(d.ch)}<div><div class="bigno">STAGE ${n} / ${STAGES.length}</div><h3>${d.title}</h3></div></div><p>${d.intro}</p>
    <ol class="todo">${d.steps.slice(0,4).map(s=>`<li>${s.t.replace(/<\/?b>/g,'')}</li>`).join('')}${d.steps.length>4?`<li>…ほか${d.steps.length-4}つのミッション</li>`:''}</ol>
    <div class="howto"><svg viewBox="0 0 64 64"><path d="M22 30V10a5 5 0 0 1 10 0v15l1-1a5 5 0 0 1 9 3v1a5 5 0 0 1 9 3v2a4.5 4.5 0 0 1 8 3v8c0 10-7 18-17 18h-4c-6 0-10-3-13-8l-9-14a5 5 0 0 1 8-6z" fill="#f4f7fb" stroke="#04060a" stroke-width="2.5"/></svg><span>画面の中の物を指で直接動かします。迷ったら、光る手のマークの動きをまねしてね。</span></div>
    <button class="btn" id="goBtn">START</button>`;
  $('#intro').hidden=false;S.paused=true;$('#goBtn').onclick=()=>{Snd.init();Snd.whoosh();$('#intro').hidden=true;S.paused=false;S.lastAct=now()-2600}}
function toTitle(){S.paused=true;$('#hud').hidden=true;$('#intro').hidden=true;$('#gate').hidden=true;$('#clear').hidden=true;cv.classList.remove('frozen');clearStage();S.cur=null;buildTitle();$('#title').hidden=false;titleScene()}
function buildTitle(){$('#cast').innerHTML=Object.keys(CH).map(k=>`<figure>${charSVG(k)}<figcaption>${CH[k].name}<small>${CH[k].f}</small></figcaption></figure>`).join('');
  $('#stsel').innerHTML=STAGES.map((s,i)=>`<button data-n="${i+1}" ${i+1>S.unlocked?'disabled':''}>${i+1}<small>${s.title.slice(0,4)}</small></button>`).join('');
  $('#stsel').querySelectorAll('button').forEach(b=>b.onclick=()=>{Snd.init();Snd.tap();go(+b.dataset.n)})}
function go(n){$('#title').hidden=true;if(!S.start)S.start=now();loadStage(n)}
let titleMols=null;
function titleScene(){titleMols=new Mols(120);for(let i=0;i<120;i++){X[i]=rnd(-9,9);Y[i]=rnd(0,9);Z[i]=rnd(-9,4);const d=randDir(.6);VX[i]=d[0];VY[i]=d[1];VZ[i]=d[2]}cam.rT=14;cam.yT=4;cam.ph=1.15}
$('#startBtn').onclick=()=>{Snd.init();Snd.fanfare();go(1)};
$('#muteBtn').onclick=()=>{Snd.init();Snd.on=!Snd.on;if(!Snd.on)Snd.flame(0);setMuteIcon()};
$('#homeBtn').onclick=()=>{Snd.tap();toTitle()};
setMuteIcon();buildTitle();titleScene();

let last=now(),cht=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.033,(t-last)/1000);last=t;S.t+=dt;
  if(S.cur){if(!S.paused)S.cur.tick(dt);S.cur.draw();cht+=dt;if(cht>.1&&!$('#chartCard').hidden){cht=0;S.cur.chart()}updateHint()}
  else if(titleMols){for(let i=0;i<120;i++){X[i]+=VX[i]*dt;Y[i]+=VY[i]*dt;Z[i]+=VZ[i]*dt;if(Math.abs(X[i])>9)VX[i]*=-1;if(Y[i]<0||Y[i]>9)VY[i]*=-1;if(Z[i]<-9||Z[i]>4)VZ[i]*=-1}titleMols.draw(120,X,Y,Z,null);cam.th+=dt*.05}
  bandT-=dt;if(bandT<=0){bandT=.5;measureBand()}applyBand();updateCamera(dt);R.render(scene,camera)}
requestAnimationFrame(loop);
</script>
