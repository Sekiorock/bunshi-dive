<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ぶんしダイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: black 3D lab you touch directly; white instrument cards float on it; white sheets for menus, gates and celebrations (Estonian blue/black/white) */
:root{
  --ink:#04060a;--paper:#ffffff;--blue:#0072CE;--blue2:#4aa3ff;--white:#f4f7fb;--mute:#93a1b4;--mute2:#5b6878;--line:rgba(244,247,251,.16);--line2:rgba(4,6,10,.13);--bad:#ff6178;
  --disp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --num:"Chakra Petch","SF Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--white);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;transition:filter .35s}
#gl.frozen{filter:grayscale(1) brightness(.4) blur(2px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#hud .pe{pointer-events:auto}
.top{display:flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border-radius:16px;padding:5px 5px 5px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.top .tt{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.stg{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--blue);white-space:nowrap}
.top h1{margin:0;font-family:var(--disp);font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.pips{display:flex;gap:3px;margin-left:auto}
.pips i{width:11px;height:4px;border-radius:2px;background:#d5dde7}
.pips i.on{background:var(--ink)}.pips i.now{background:var(--blue)}
.icon{width:38px;height:38px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line2);color:var(--ink);display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px}
.icon.lang{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.04em}
#coach{background:var(--paper);color:var(--ink);border-radius:18px;padding:10px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 2px var(--ink);transition:box-shadow .3s,background .3s}
#coach.flash{background:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue2),0 0 40px rgba(74,163,255,.7)}
#coach .crow{display:flex;align-items:center;gap:8px;margin-bottom:3px}
#coach .cstep{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--blue)}
#coach.flash .cstep{color:#fff}
#coach .cdots{display:flex;gap:4px;margin-left:auto}
#coach .cdots i{width:9px;height:9px;border-radius:50%;background:#cfd8e3}
#coach .cdots i.on{background:var(--blue)}#coach .cdots i.now{background:var(--ink);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
#coach .ctext{font-family:var(--disp);font-weight:800;font-size:clamp(16px,4.6vw,21px);line-height:1.4;text-wrap:balance}
#coach .ctext b{color:var(--blue)}#coach.flash .ctext b{color:#fff}
#coach .ctext.in{animation:cin .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes cin{from{transform:translateX(24px);opacity:0}}
.mid{display:flex;justify-content:flex-end}
#chartCard{width:min(44%,240px);background:var(--paper);color:var(--ink);border-radius:14px;padding:7px 9px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:width .3s}
#chartCard.big{width:100%}
#chartCard .lab{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden;font-family:var(--num);font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--mute2)}
#chartCard canvas{display:block;width:100%;height:90px;margin-top:3px;transition:height .3s}
#chartCard.big canvas{height:200px}
.legend{display:flex;flex-wrap:wrap;gap:2px 9px;font-size:10px;color:var(--mute2);margin-top:2px}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:middle}
.spacer{flex:1}
#extra{display:flex;justify-content:center;align-items:flex-end;gap:10px}
#readouts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ro{background:var(--paper);border-radius:14px;padding:5px 11px 6px;min-width:0;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:background .2s,box-shadow .2s}
.ro .k{font-size:11px;color:var(--mute2);display:block;font-weight:700;white-space:nowrap}
.ro .v{font-family:var(--num);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15;color:var(--ink)}
.ro .v small{font-size:11px;font-weight:500;color:var(--mute2);margin-left:2px}
.ro.hot{background:var(--blue);box-shadow:0 0 0 3px #fff,0 0 24px rgba(74,163,255,.7)}.ro.hot .k,.ro.hot .v,.ro.hot .v small{color:#fff}
.ro.state .v{font-family:var(--disp);font-size:17px}
#talk{display:flex;gap:8px;align-items:flex-end;min-height:62px;transition:opacity .4s,transform .4s}
#talk.off{opacity:0;transform:translateY(10px);pointer-events:none!important}
#talk .gface{flex:none;width:56px;height:56px}
#talk .gface svg{width:100%;height:100%}
.bubble{flex:1;min-width:0;background:#fff;color:var(--ink);border-radius:16px 16px 16px 4px;padding:7px 11px;font-size:13.5px;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.bubble .who{display:block;font-family:var(--disp);font-weight:800;font-size:11px;color:var(--blue)}
#talk.pop .bubble{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.9);opacity:.3}}
.bal{width:min(210px,58vw);background:var(--paper);border-radius:18px;padding:4px 6px 2px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:box-shadow .2s,transform .1s}
.bal:active{transform:scale(.97)}
.bal.near{box-shadow:0 0 0 4px var(--blue2),0 0 30px rgba(74,163,255,.7);animation:breath 1s ease-in-out infinite alternate}
@keyframes breath{to{box-shadow:0 0 0 7px rgba(74,163,255,.4),0 0 40px rgba(74,163,255,.8)}}
.bal svg{display:block;width:100%;height:auto}
.bal .cap{display:block;font-family:var(--disp);font-weight:800;font-size:13px;color:var(--ink);padding-bottom:4px}
.gauge{width:min(170px,44vw);background:var(--paper);border-radius:18px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.gauge svg{display:block;width:100%;height:auto}
.meter{width:min(300px,82vw);background:var(--paper);color:var(--ink);border-radius:16px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.meter .mk{display:flex;justify-content:space-between;font-family:var(--disp);font-weight:800;font-size:13px}
.meter .mk span:last-child{font-family:var(--num);color:var(--blue)}
.meter .bar{position:relative;height:16px;border-radius:8px;background:#e3e9f0;margin-top:5px;overflow:hidden}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--blue2),var(--blue));border-radius:8px}
.meter .bar i.max{background:var(--ink)}
.meter .note{font-size:11.5px;color:var(--mute2);margin-top:4px;min-height:1.4em;font-weight:700}
.vbtn{min-height:44px;padding:0 16px;border-radius:999px;background:var(--paper);color:var(--ink);font-family:var(--disp);font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 0 0 2px var(--ink);display:flex;align-items:center;gap:6px}
.vbtn svg{width:18px;height:18px}
.vbtn.on{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.clock{width:min(150px,40vw);background:var(--paper);border-radius:50%;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.4);touch-action:none;cursor:grab}
.clock svg{display:block;width:100%;height:auto}

#hand{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:8;transition:opacity .3s}
#hand.off{opacity:0}
#hand .ring{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:3px solid var(--white);box-shadow:0 0 18px var(--blue2);animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
#hand .fg{position:absolute;left:-14px;top:-6px;width:58px;height:58px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#hand .tip{position:absolute;left:30px;top:-46px;white-space:nowrap;background:var(--blue);color:#fff;font-family:var(--disp);font-weight:800;font-size:15px;padding:5px 11px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#hand.g-up .fg{animation:gup 1.5s cubic-bezier(.5,0,.3,1) infinite}
#hand.g-down .fg{animation:gdown 1.5s cubic-bezier(.5,0,.3,1) infinite}
#hand.g-h .fg{animation:gh 1.8s ease-in-out infinite}
#hand.g-v .fg{animation:gv 1.8s ease-in-out infinite}
#hand.g-tap .fg{animation:gtap 1s ease-in-out infinite}
#hand.g-to .fg{animation:gto 1.9s cubic-bezier(.5,0,.3,1) infinite}
#hand.g-spin .fg{animation:gspin 1.6s linear infinite}
@keyframes gup{0%{transform:translateY(30px);opacity:0}15%{opacity:1}70%{transform:translateY(-70px);opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes gdown{0%{transform:translateY(-60px);opacity:0}15%{opacity:1}70%{transform:translateY(40px);opacity:1}100%{transform:translateY(40px);opacity:0}}
@keyframes gh{0%,100%{transform:translateX(-50px)}50%{transform:translateX(50px)}}
@keyframes gv{0%,100%{transform:translateY(30px)}50%{transform:translateY(-60px)}}
@keyframes gtap{0%,100%{transform:scale(1)}50%{transform:scale(.82) translateY(6px)}}
@keyframes gto{0%{transform:translate(0,0);opacity:0}12%{opacity:1}75%{transform:translate(var(--dx),var(--dy));opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes gspin{from{transform:rotate(0) translateX(34px) rotate(0)}to{transform:rotate(360deg) translateX(34px) rotate(-360deg)}}

#toast{position:fixed;left:0;right:0;top:44%;text-align:center;pointer-events:none;z-index:6;padding:0 16px;opacity:0}
#toast .t{display:inline-block;font-family:var(--disp);font-weight:800;font-size:clamp(32px,10.5vw,52px);color:#fff;text-shadow:0 0 24px rgba(74,163,255,.9),0 4px 0 var(--blue);letter-spacing:.04em}
#toast .s{display:block;font-family:var(--disp);font-weight:800;font-size:16px;margin-top:4px;color:var(--white);text-shadow:0 2px 8px #000}
#toast.go{animation:toast 1.7s ease forwards}
@keyframes toast{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

/* sheets */
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow:auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov.dim{background:rgba(2,4,8,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.panel{width:min(520px,100%);background:var(--paper);color:var(--ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 6px 0 var(--blue)}
.panel.in{animation:rise .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.btn{min-height:58px;border-radius:18px;background:var(--blue);color:#fff;font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:.03em;box-shadow:0 6px 0 #003f73,0 10px 24px rgba(0,114,206,.35);transition:transform .08s,box-shadow .08s,opacity .2s;touch-action:manipulation;padding:0 10px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #003f73}
.btn:disabled{background:#e6ebf1;color:#8794a5;box-shadow:0 6px 0 #c9d2dc;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink),0 6px 0 var(--ink)}
.btn.ghost:active{box-shadow:inset 0 0 0 2.5px var(--ink),0 2px 0 var(--ink)}
.btn small{display:block;font-size:11px;font-weight:500;opacity:.8;letter-spacing:.06em}
.wide{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}

#title{background:#fff;color:var(--ink)}
.ttl{width:min(520px,100%);display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center}
.flag{display:flex;width:120px;height:14px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 2px var(--ink)}
.flag i{flex:1}
.ttl .kicker{font-family:var(--num);font-size:11px;letter-spacing:.3em;color:var(--blue)}
.ttl h2{margin:0;font-family:var(--disp);font-weight:800;font-size:clamp(46px,14vw,74px);line-height:1;letter-spacing:.02em;color:var(--ink)}
.ttl h2 span{color:var(--blue)}
.ttl p{margin:0;color:#2a3442;font-size:14px;line-height:1.7;max-width:34em}
.langsel{display:flex;border-radius:999px;box-shadow:inset 0 0 0 2px var(--ink);padding:3px;gap:3px}
.langsel button{min-width:96px;min-height:36px;border-radius:999px;font-family:var(--disp);font-weight:800;font-size:14px;color:var(--ink)}
.langsel button.on{background:var(--ink);color:#fff}
.partyT{display:flex;align-items:center;justify-content:space-between;width:100%;font-family:var(--disp);font-weight:800;font-size:13px}
.partyT span:last-child{font-family:var(--num);color:var(--blue)}
.party{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.slot{min-width:0;aspect-ratio:1;border-radius:14px;background:#eef3f9;display:grid;place-items:center;position:relative;overflow:hidden}
.slot svg{display:block;width:96%;height:96%;max-width:100%}
.slot.off svg{filter:brightness(0);opacity:.13}
.slot.off::after{content:"?";position:absolute;font-family:var(--disp);font-weight:800;font-size:18px;color:#9aa8b8}
.slot.kslot{background:var(--ink)}
.slot.kslot.off::after{color:#5b6878}
.slot.new{animation:slotIn .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes slotIn{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.3)}100%{transform:none}}
.stsel{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:100%}
.stsel button{min-height:48px;border-radius:12px;background:#fff;border:2px solid var(--ink);color:var(--ink);font-family:var(--num);font-weight:700;font-size:16px;line-height:1.1}
.stsel button:disabled{opacity:.25}
.stsel button small{display:block;font-size:9px;font-family:var(--body);color:var(--mute2)}

.intro-head{display:flex;gap:14px;align-items:center}
.intro-head svg{width:88px;height:88px;flex:none}
.bigno{font-family:var(--num);font-weight:700;letter-spacing:.2em;color:var(--blue);font-size:12px}
.panel h3{margin:2px 0 0;font-family:var(--disp);font-weight:800;font-size:25px;line-height:1.2;text-wrap:balance;color:var(--ink)}
.panel p{margin:0;font-size:15px;line-height:1.75;color:#2a3442}
.vs{display:inline-block;background:var(--ink);color:#fff;font-family:var(--disp);font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px;margin-bottom:4px}
.say{background:#eef4fb;border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:14px;line-height:1.65;font-weight:700;color:var(--ink)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;counter-reset:t}
.todo li{counter-increment:t;display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid #dbe5f0;border-radius:14px;padding:8px 12px;font-family:var(--disp);font-weight:800;font-size:14.5px;line-height:1.45;color:var(--ink)}
.todo li::before{content:counter(t);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--num);font-size:13px;margin-top:1px}
.howto{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute2)}
.howto svg{width:34px;height:34px;flex:none}

/* gate */
#gate{position:fixed;inset:0;z-index:20;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:sheet .45s cubic-bezier(.2,1.1,.3,1)}
@keyframes sheet{from{transform:translateY(100%)}}
.ghead{flex:none;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.gtag{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.18em;background:var(--ink);color:#fff;padding:4px 10px;border-radius:999px}
.gprog{margin-left:auto;display:flex;gap:4px}
.gprog i{width:22px;height:5px;border-radius:3px;background:#d5dde7}
.gprog i.on{background:var(--blue)}.gprog i.now{background:var(--ink)}
.gmain{flex:1;min-height:0;display:flex;flex-direction:column}
.gfig{flex:none;padding:0 max(10px,env(safe-area-inset-right,0px)) 4px max(10px,env(safe-area-inset-left,0px))}
.gchart{position:relative;height:min(44vh,calc(100vw * .74));max-height:440px;background:var(--ink);border-radius:16px;touch-action:none;overflow:hidden}
.gchart > svg{position:absolute;inset:0;width:100%;height:100%}
.gchart .cur{pointer-events:none}
.gnote{font-size:12px;color:var(--mute2);text-align:center;margin-top:4px}
.gnote b{color:var(--ink);font-family:var(--num)}
.gbody{flex:1;min-height:0;overflow:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.gq{display:flex;gap:10px;align-items:flex-start}
.gq .f{width:48px;height:48px;flex:none}
.gq .f svg{width:100%;height:100%}
.gq p{font-size:16px;line-height:1.6;margin:0;font-weight:700;color:var(--ink)}
.choices{display:grid;grid-template-columns:1fr;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.ch{display:flex;align-items:center;gap:10px;text-align:left;min-height:54px;padding:8px 12px;border-radius:16px;background:#fff;border:2px solid #cdd6e1;box-shadow:0 3px 0 #cdd6e1;font-size:15px;font-weight:700;line-height:1.4;color:var(--ink);transition:transform .08s,background .2s}
.ch:active{transform:scale(.97)}
.ch i{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-family:var(--num);font-weight:700;background:#eef2f7}
.ch.ok{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(74,163,255,.35)}.ch.ok i{background:#fff;color:var(--blue)}
.ch.ng{opacity:.35;border-color:var(--bad);animation:shake .35s}
.ch:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.gex{border-radius:16px;padding:11px 13px;font-size:14px;line-height:1.75;color:var(--ink);animation:rise .35s ease}
.gex.hint{background:#fff1f3;border:1px solid #ffb3c0}.gex.good{background:#e8f2fd;border:1px solid #9cc8f5}
.gex b{font-family:var(--disp)}
.gfoot{flex:none;padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line2)}
.gfoot .btn{width:100%}

  w:{ja:'水',en:'water',ch:'mizu',A:8.07131,B:1730.63,C:233.426,col:0x1f7fe0,ears:true,svg:'#4aa3ff'},

/* ---- kimo-kawa characters ---- */

function shakeEl(el,ms){el.animate([{transform:'translate(0,0)'},{transform:'translate(-4px,3px)'},{transform:'translate(5px,-2px)'},{transform:'translate(-3px,-4px)'},{transform:'translate(0,0)'}],{duration:120,iterations:Math.round(ms/120)})}
function countUp(el,to,fmt,ms){const t0=now();let last=-1;(function f(){const k=Math.min(1,(now()-t0)/ms);const v=Math.round(to*(1-Math.pow(1-k,3)));if(v!==last){last=v;el.textContent=fmt(v);Snd.tick()}if(k<1)requestAnimationFrame(f)})()}

  if(id==='eteru')return W+`<text x="150" y="58" text-anchor="middle" font-size="22" font-family="Chakra Petch">C₂H₅ — O — C₂H₅</text><text x="150" y="30" text-anchor="middle" font-size="12" fill="#5b6878">${J('OにHがついていない','no H on the O')}</text>

  if(id==='dora')return W+`<g stroke="#04060a" stroke-width="4"><line x1="92" y1="56" x2="132" y2="56"/><line x1="92" y1="68" x2="132" y2="68"/><line x1="168" y1="56" x2="208" y2="56"/><line x1="168" y1="68" x2="208" y2="68"/></g>${atom(80,62,22,'#fff','O')}${atom(150,62,20,'#1a2028','C','#fff')}${atom(220,62,22,'#fff','O')}

function prof(id){
  if(id==='mizu')return{tags:[[J('極性分子','polar'),'b'],[J('水素結合あり','hydrogen bonds'),'b'],[J('融点 0℃','mp 0 °C'),'w'],[J('沸点 100℃','bp 100 °C'),'w'],[J('分子量 18','M 18'),'w']],
    facts:J(['折れ線形の極性分子。O原子がわずかに負（δ−）、H原子がわずかに正（δ+）に帯びている。','分子どうしが水素結合で強く引き合うので、分子量18と小さいのに沸点は100℃と高い。','氷は水素結合ですき間の多い結晶をつくる。だから氷は水に浮き、状態図の融解曲線は左上がりになる。','蒸発熱は41 kJ/molと大きい。汗が蒸発すると体が冷えるのはこのため。'],['A bent, polar molecule: the O atom is slightly negative (δ−) and the H atoms slightly positive (δ+).','Strong hydrogen bonds between molecules give it a high boiling point (100 °C) even though its molecular mass is only 18.','In ice, hydrogen bonds build an open crystal with lots of space. That is why ice floats and why water’s melting curve leans left.','Its heat of vaporization is large (41 kJ/mol). That is why evaporating sweat cools you down.']),
    link:J('<b>ステージ1</b>で温度が止まった0℃と100℃では、熱はぼくらの分子間の引力を切るのに使われていたんだ。','In <b>stage 1</b>, at 0 °C and 100 °C the heat was used to break the attraction between us.')};
  if(id==='nafu')return{tags:[[J('無極性分子','nonpolar'),''],[J('水素結合なし','no H-bonds'),''],[J('融点 81℃','mp 81 °C'),'w'],[J('昇華しやすい','sublimes easily'),'b'],[J('分子量 128','M 128'),'w']],
    facts:J(['ベンゼン環が2つつながった平面形の分子。電荷のかたよりがない無極性分子。','分子間にはたらくのは弱いファンデルワールス力だけ。','そのため常温でも固体から直接気体になる（昇華）。防虫剤が少しずつ小さくなるのはこのため。','同じ仲間：ヨウ素 I₂、ドライアイス CO₂ など。'],['A flat molecule of two fused benzene rings, with no uneven charge — nonpolar.','Only weak van der Waals forces act between its molecules.','So even at room temperature it turns straight from solid to gas (sublimation). That is why mothballs slowly shrink.','Same group: iodine (I₂), dry ice (CO₂) and others.']),
    link:J('<b>ステージ2</b>で軽く引くだけではがれたのは、水素結合がなかったから。','In <b>stage 2</b> I came off with a light pull because there were no hydrogen bonds.')};
  if(id==='etano')return{tags:[[J('極性分子','polar'),'b'],[J('水素結合あり','hydrogen bonds'),'b'],[J('沸点 78℃','bp 78 °C'),'w'],[J('分子量 46','M 46'),'w']],
    facts:J(['−OH（ヒドロキシ基）をもつので極性があり、分子どうしで水素結合をつくる。','水素結合をつくれる部分は水より少ないので、沸点は水より低い78℃。同じ温度での蒸気圧は水より大きい。','水とどんな割合でもよく混ざる。消毒用アルコールや燃料に使われる。','蒸発するとき熱をうばうので、手につけるとひんやりする。'],['Its −OH (hydroxy) group makes it polar, so its molecules form hydrogen bonds.','It has fewer places to hydrogen-bond than water, so it boils lower (78 °C) and has a higher vapor pressure at the same temperature.','It mixes with water in any ratio. Used as hand sanitizer and fuel.','It takes heat as it evaporates, so it feels cool on your skin.']),
    link:J('<b>ステージ5</b>の蒸気圧曲線で、エタノールが水より上にあったのはこのため。','That is why ethanol’s curve sat above water’s in <b>stage 5</b>.')};
  if(id==='eteru')return{tags:[[J('水素結合なし','no H-bonds'),''],[J('沸点 34℃','bp 34 °C'),'w'],[J('分子量 74','M 74'),'w'],[J('とても蒸発しやすい','very volatile'),'b']],
    facts:J(['2つのエチル基がO原子でつながった分子。O原子にHが結合していないので、分子どうしで水素結合をつくれない。','分子量74とエタノール（46）より大きいのに、沸点はずっと低い34℃。水素結合の有無が沸点を大きく変える例。','とても蒸発しやすく、蒸気は引火しやすいので火気厳禁。昔は麻酔薬に使われた。','水にはあまり溶けず、有機物を溶かし出す溶媒（抽出）に使われる。'],['Two ethyl groups joined by an O atom. No H is bonded to the O, so its molecules cannot hydrogen-bond with each other.','Its molecular mass (74) is larger than ethanol’s (46), yet it boils far lower (34 °C) — hydrogen bonding makes the difference.','Very volatile and its vapor catches fire easily — keep flames away. It was once used as an anesthetic.','It barely dissolves in water and is used as a solvent to extract organic substances.']),
    link:J('20℃でも蒸気圧は約0.59×10⁵ Pa。<b>ステージ5</b>で、たった34℃で沸騰したよ。','Even at 20 °C my vapor pressure is about 0.59×10⁵ Pa. In <b>stage 5</b> I boiled at just 34 °C.')};
  if(id==='nitro')return{tags:[[J('無極性分子','nonpolar'),''],[J('水素結合なし','no H-bonds'),''],[J('沸点 −196℃','bp −196 °C'),'w'],[J('分子量 28','M 28'),'w']],
    facts:J(['2つのN原子が三重結合でかたく結びついた分子。とても安定で反応しにくい。','無極性で分子間力が非常に弱いので、沸点は−196℃。常温では気体。','空気の体積の約78%を占める。','液体窒素は、食品の急速冷凍、細胞の保存、超伝導の実験などの冷却に使われる。'],['Two N atoms locked together by a triple bond — very stable and unreactive.','Nonpolar with very weak intermolecular forces, so it boils at −196 °C and is a gas at room temperature.','About 78% of air by volume.','Liquid nitrogen is used for flash-freezing food, storing cells and cooling superconductors.']),
    link:J('<b>ステージ1</b>の冷却は液体窒素のイメージ。<b>ステージ5</b>の山の空気も、ほとんどがオレたちだ。','The cooling in <b>stage 1</b> is liquid nitrogen. The mountain air in <b>stage 5</b> is mostly us.')};
  if(id==='dora')return{tags:[[J('無極性分子','nonpolar'),''],[J('直線形','linear'),'w'],[J('昇華点 −78.5℃','sublimes −78.5 °C'),'b'],[J('臨界点 31℃・73.8×10⁵Pa','critical 31 °C · 73.8×10⁵ Pa'),'w']],
    facts:J(['O=C=O の直線形。C=O結合には極性があるが、左右で打ち消し合うので分子全体は無極性。','三重点の圧力（5.15×10⁵ Pa）が大気圧より高いので、大気圧では液体にならずに昇華する（ドライアイス）。','臨界点が31℃・73.8×10⁵ Pa と比較的おだやかな条件なので、超臨界流体として産業で最もよく使われる。','消火器、炭酸飲料、植物の光合成の原料にもなる。'],['A linear O=C=O molecule. Each C=O bond is polar, but they cancel out, so the molecule is nonpolar.','Its triple-point pressure (5.15×10⁵ Pa) is above atmospheric pressure, so at normal pressure it sublimes instead of melting (dry ice).','Its critical point (31 °C, 73.8×10⁵ Pa) is fairly mild, which makes it the most widely used supercritical fluid in industry.','Also found in fire extinguishers and fizzy drinks, and plants use it for photosynthesis.']),
    link:J('<b>ステージ6</b>で、どれだけ押しても固体のままだったのは、オレの融解曲線が右上がりだからさ。','In <b>stage 6</b> I stayed solid however hard you pressed, because my melting curve leans right.')};
  return null}
function bossProf(){return `
  <div class="ptitle">${J('超臨界流体ってなに？','What is a supercritical fluid?')}</div>

  <div class="props"><div><b>${J('液体のように','Like a liquid')}</b>${J('物をよく溶かす','dissolves things well')}</div><div><b>${J('気体のように','Like a gas')}</b>${J('すき間にすっと入りこむ','slips into tiny gaps')}</div><div><b>${J('液面がない','No surface')}</b>${J('表面張力がはたらかない','no surface tension')}</div></div>
  <div class="ptitle">${J('産業の現場で活躍中','At work in industry')}</div>
  <div class="pfig">${profFig('boss')}</div>
  <div class="icards">
   <div class="icard"><h4><i>01</i>${J('半導体・ナノテクノロジー','Semiconductors & nanotech')}</h4><p>${J('スマホやパソコンのチップの回路は、髪の毛の数千分の1ほどの細さ。洗ったあと液体で乾かすと、表面張力で細い柱どうしが引っぱられて倒れてしまう。表面張力がない超臨界CO₂で洗浄・乾燥すれば、細かいパターンを壊さずに仕上げられる。センサーなどの微小な部品（MEMS）づくりにも使われる。','Chip circuits in phones and computers are thousands of times thinner than a hair. If they are dried with a liquid after washing, surface tension pulls the tiny structures together and they collapse. Supercritical CO₂ has no surface tension, so it can clean and dry them without damage. It is also used to make micro-machines (MEMS) such as sensors.')}</p></div>
   <div class="icard"><h4><i>02</i>${J('ナノ材料','Nanomaterials')}</h4><p>${J('超臨界の水の中では、金属酸化物のナノ粒子を短時間でつくれる（日本の大学で生まれた技術）。超臨界乾燥でつくるエアロゲルは、体積のほとんどが空気という超軽量の断熱材。','In supercritical water, metal-oxide nanoparticles can be made in moments — a technique developed at a Japanese university. Supercritical drying makes aerogels: ultralight insulators that are mostly air.')}</p></div>
   <div class="icard"><h4><i>03</i>${J('食品・医薬品','Food & medicine')}</h4><p>${J('コーヒーのカフェイン除去、ビールのホップや香りの成分の抽出、医薬品の分離・精製。CO₂は圧力をもどすと気体になって抜けるので、有害な溶媒が食品に残らない。','Decaffeinating coffee, extracting hop and aroma compounds, and separating and purifying medicines. When the pressure is released, CO₂ simply turns back into gas, so no harmful solvent stays in the food.')}</p></div>
   <div class="icard"><h4><i>04</i>${J('環境・エネルギー','Environment & energy')}</h4><p>${J('超臨界水は、分解しにくい有害な有機物を短時間で分解する研究や実用化が進む。超臨界CO₂を使った、小型で効率の高い発電の仕組みの実証も行われている。','Supercritical water can break down hard-to-destroy harmful organic substances quickly, and it is being researched and put into use. Compact, efficient power cycles using supercritical CO₂ are also being demonstrated.')}</p></div>
  </div>
  <div class="why"><h4>${J('なぜ、世界に超臨界技術が必要なのか','Why the world needs supercritical technology')}</h4>
   <p>${J('AI、医療機器、自動車、スマホ――今の社会は半導体の上に成り立っている。チップの性能を上げる王道は、回路をもっと細かくすること。でも細かくなるほど、ふだんは気にもしない液体の「表面張力」が、回路を倒す大きな壁になる。液体でも気体でもない超臨界流体は、その壁をこえる方法の一つだ。','AI, medical devices, cars, phones — modern society runs on semiconductors. The main way to make chips better is to make circuits smaller. But the smaller they get, the more something we normally ignore — the surface tension of liquids — becomes a wall that knocks circuits over. A supercritical fluid, neither liquid nor gas, is one way past that wall.')}</p>
   <p>${J('しかも、有害な有機溶媒の代わりに、回収してくり返し使えるCO₂や水で仕事ができる。教室で学んだ「状態図の右上の世界」は、未来のものづくりと地球環境の両方を支える技術につながっている。','And it does the job with CO₂ or water, which can be collected and reused, instead of harmful organic solvents. The “top-right corner of the phase diagram” you learned in class connects to technology that supports both future manufacturing and the planet.')}</p></div>`}
function openProf(id){const p=$('#profPanel');const n=PARTY.indexOf(id)+1;Snd.init();Snd.tap();
  if(!S.allies.has(id)){p.innerHTML=`<button class="pclose" id="pX" aria-label="close">×</button><div class="locked">${charSVG(id)}<h3>${J('まだ なかまになっていない','Not on your team yet')}</h3><p>${id==='boss'?J('すべてのステージをクリアすると…？','Clear every stage and...?'):J(`ステージ${n}をクリアすると なかまになる`,`Clear stage ${n} to recruit`)}</p></div>`}
  else if(id==='boss'){p.innerHTML=`<button class="pclose" id="pX" aria-label="close">×</button><div class="phead">${charSVG('boss')}<div><div class="pf">scCO₂ ・ ${J('超臨界二酸化炭素','supercritical CO₂')}</div><h3>${cname('boss')}</h3></div></div>
      <div class="tags"><span class="b">${J('臨界点をこえた状態','beyond the critical point')}</span><span class="w">${J('液体でも気体でもない','neither liquid nor gas')}</span><span>${J('ラスボス','final boss')}</span></div>${bossProf()}<button class="btn" id="pOk">${J('閉じる','Close')}</button>`}
  else{const d=prof(id);p.innerHTML=`<button class="pclose" id="pX" aria-label="close">×</button><div class="phead">${charSVG(id)}<div><div class="pf">${CH[id].f}</div><h3>${cname(id)}</h3></div></div>
      <div class="tags">${d.tags.map(t=>`<span class="${t[1]}">${t[0]}</span>`).join('')}</div><div class="pfig">${profFig(id)}</div><ul class="facts">${d.facts.map(f=>`<li>${f}</li>`).join('')}</ul><div class="plink">${d.link}</div><button class="btn" id="pOk">${J('閉じる','Close')}</button>`}
  const close=()=>{$('#prof').hidden=true;Snd.tap()};$('#pX').onclick=close;const ok=$('#pOk');if(ok)ok.onclick=close;
  const ov=$('#prof');ov.hidden=false;ov.scrollTop=0;ov.onclick=e=>{if(e.target===ov)close()};p.classList.remove('in');void p.offsetWidth;p.classList.add('in')}
function bindParty(host){host.querySelectorAll('.slot').forEach(el=>{const id=el.dataset.id;
  el.onclick=()=>{$('#tip').hidden=true;openProf(id)};
  el.onpointerenter=e=>{if(e.pointerType!=='mouse')return;const t=$('#tip');const has=S.allies.has(id);t.innerHTML=has?`<b>${cname(id)}</b> ${id==='boss'?'scCO₂':CH[id].f}<br>${J('クリックでくわしく','Click for details')}`:J('？？？ まだ なかまではない','??? not on your team yet');const r=el.getBoundingClientRect();t.hidden=false;t.style.left=Math.min(innerWidth-240,Math.max(8,r.left))+'px';t.style.top=(r.bottom+8)+'px'};
  el.onpointerleave=()=>{$('#tip').hidden=true}})}

/* ================= FLOW ================= */
function clearStage(){scene.remove(G);G.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(m=>{if(m.map&&m.map!==FACE&&m.map!==FACE_DARK&&!Object.values(CTEX).includes(m.map))m.map.dispose();m.dispose()})}});
  LS.forEach(s=>{s.userData.L.ja.map.dispose();s.userData.L.en.map.dispose()});LS.length=0;
  G=new THREE.Group();scene.add(G);ST.fill(0);grabs.length=0;active=null;$('#readouts').innerHTML='';$('#extra').innerHTML='';Snd.flame(0);S.hint=null;EQ.onEv=EQ.onCo=null;
  scene.fog.near=24;scene.fog.far=64;scene.fog.color.setHex(0x04060a);R.setClearColor(0x04060a);grid.position.y=-.3;grid.visible=true;cam.xT=0;cam.zT=0;cam.tgt.x=0;cam.tgt.z=0}
function renderIntro(){const d=S.cur,n=S.stage;const p=$('#introPanel');
  p.innerHTML=`<div class="intro-head">${charSVG(d.ch)}<div><div class="bigno">STAGE ${n} / ${NST}</div><h3>${d.title}</h3></div></div>
    <div><span class="vs">${J(`${cname(d.ch)} があらわれた！`,`${cname(d.ch)} appears!`)}</span><div class="say">${d.dare}</div></div>
    <p>${d.intro}</p>
    <ol class="todo">${d.steps.slice(0,4).map(s=>`<li>${s.t.replace(/<\/?b>/g,'')}</li>`).join('')}${d.steps.length>4?`<li>${J(`…ほか${d.steps.length-4}つのミッション`,`...and ${d.steps.length-4} more missions`)}</li>`:''}</ol>
    <div class="howto"><svg viewBox="0 0 64 64"><path d="M22 30V10a5 5 0 0 1 10 0v15l1-1a5 5 0 0 1 9 3v1a5 5 0 0 1 9 3v2a4.5 4.5 0 0 1 8 3v8c0 10-7 18-17 18h-4c-6 0-10-3-13-8l-9-14a5 5 0 0 1 8-6z" fill="#f4f7fb" stroke="#04060a" stroke-width="2.5"/></svg><span>${J('画面の中の物を指で直接動かします。迷ったら、光る手のマークの動きをまねしてね。','Move things in the scene directly with your finger. If you get stuck, copy the glowing hand.')}</span></div>
    <button class="btn" id="goBtn">START</button>`;
  $('#goBtn').onclick=()=>{Snd.init();Snd.whoosh();$('#intro').hidden=true;S.paused=false;S.lastAct=now()-2600}}
function loadStage(n){clearStage();S.stage=n;const d=STAGES[n-1];S.cur=d;d.st={};d.thR=null;cam.th=0;cam.ph=1.15;S.si=0;S.sf[n]=0;S.stt[n]=0;
  d.setup();readouts(d.ro());setChart(d.chartInfo());$('#chartCard').classList.remove('big');headerUI();$('#hud').hidden=false;renderCoach();$('#talk').classList.add('off');
  renderIntro();$('#intro').hidden=false;S.paused=true}
function headerUI(){const n=S.stage,d=S.cur;if(!d)return;$('#stgNo').textContent=`STAGE ${n}`;$('#stgTitle').textContent=d.title;$('#pips').innerHTML=STAGES.map((s,i)=>`<i class="${i+1<n?'on':i+1===n?'now':''}"></i>`).join('')}
function toTitle(){S.paused=true;$('#hud').hidden=true;$('#intro').hidden=true;$('#gate').hidden=true;closeCele();cv.classList.remove('frozen');clearStage();S.cur=null;buildTitle();$('#title').hidden=false;titleScene()}
function buildTitle(){$('#ttlP').textContent=J('分子のサイズになって、物質の三態の世界へ。ステージをクリアするたびに、ライバルの分子が仲間になる。最後に待つのは…？','Shrink to the size of a molecule and dive into the states of matter. Each stage you clear, a rival molecule joins your team. And at the very end...?');
  $('#partyLab').textContent=J('なかま（タップで図鑑）','Team (tap for profiles)');$('#partyCnt').textContent=`${[...S.allies].filter(a=>PARTY.includes(a)).length} / ${PARTY.length}`;$('#tparty').innerHTML=partyHTML(null);bindParty($('#tparty'));
  $('#startBtn').innerHTML=J('スタート<small>音が出ます</small>','START<small>sound on</small>');
  $('#stsel').innerHTML=STAGES.map((s,i)=>`<button data-n="${i+1}" ${i+1>S.unlocked?'disabled':''}>${i+1}<small>${s.short}</small></button>`).join('');
  $('#stsel').querySelectorAll('button').forEach(b=>b.onclick=()=>{Snd.init();Snd.tap();go(+b.dataset.n)});
  $('#langSel').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang))}
function setLang(l){if(l===S.lang)return;S.lang=l;document.documentElement.lang=l;saveProg();$('#langBtn').textContent=l==='ja'?'EN':'JA';buildTitle();relangSprites();
  if(S.cur&&!$('#hud').hidden){headerUI();renderCoach(false);relabelRO(S.cur.ro());setChart(S.cur.chartInfo());S.cur.relang&&S.cur.relang();$('#talk').classList.add('off');if(!$('#intro').hidden)renderIntro()}}
$('#langSel').querySelectorAll('button').forEach(b=>b.onclick=()=>{Snd.init();Snd.tap();setLang(b.dataset.l)});
$('#langBtn').onclick=()=>{Snd.init();Snd.tap();setLang(S.lang==='ja'?'en':'ja')};
function go(n){$('#title').hidden=true;if(!S.start)S.start=now();loadStage(n)}
let titleMols=null;
function titleScene(){titleMols=new Mols(120);for(let i=0;i<120;i++){X[i]=rnd(-9,9);Y[i]=rnd(0,9);Z[i]=rnd(-9,4);const d=randDir(.6);VX[i]=d[0];VY[i]=d[1];VZ[i]=d[2]}cam.rT=14;cam.yT=4;cam.ph=1.15}
$('#startBtn').onclick=()=>{Snd.init();Snd.jingle();go(1)};
$('#muteBtn').onclick=()=>{Snd.init();Snd.on=!Snd.on;if(!Snd.on)Snd.flame(0);setMuteIcon()};
$('#homeBtn').onclick=()=>{Snd.tap();toTitle()};
document.documentElement.lang=S.lang;$('#langBtn').textContent=S.lang==='ja'?'EN':'JA';setMuteIcon();buildTitle();titleScene();

let last=now(),cht=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.033,(t-last)/1000);last=t;S.t+=dt;
  if(S.cur){if(!S.paused)S.cur.tick(dt);S.cur.draw();cht+=dt;if(cht>.1&&!$('#chartCard').hidden){cht=0;S.cur.chart()}updateHint()}
  else if(titleMols){for(let i=0;i<120;i++){X[i]+=VX[i]*dt;Y[i]+=VY[i]*dt;Z[i]+=VZ[i]*dt;if(Math.abs(X[i])>9)VX[i]*=-1;if(Y[i]<0||Y[i]>9)VY[i]*=-1;if(Z[i]<-9||Z[i]>4)VZ[i]*=-1}titleMols.draw(120,X,Y,Z,null);cam.th+=dt*.05}
  bandT-=dt;if(bandT<=0){bandT=.5;measureBand()}applyBand();updateCamera(dt);R.render(scene,camera)}
requestAnimationFrame(loop);
</script>
</body>
